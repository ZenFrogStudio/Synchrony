<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src {{cspSource}}; script-src 'nonce-{{nonce}}'; img-src {{cspSource}} data:; font-src {{cspSource}};"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="chronos-mark" content="{{markUri}}" />
    <link href="{{codiconUri}}" rel="stylesheet" />
    <link href="{{styleUri}}" rel="stylesheet" />
    <title>Chronos</title>
  </head>
  <body>
    <div id="setup" class="banner" hidden></div>
    <div id="notice" class="notice" hidden></div>

    <div id="drop-overlay" class="drop-overlay" aria-hidden="true">
      <p class="drop-overlay-title">Drop a .md file to schedule it</p>
    </div>

    <main class="shell">
      <aside class="library">
        <header class="library-head">
          <h1 class="library-title">Plan library</h1>
          <!-- Chronos data is per-folder, so this says whose plans these are.
               Only shown when the workspace has more than one folder to pick. -->
          <select id="root-folder" class="root-folder" aria-label="Chronos folder" hidden></select>
          <div class="library-actions">
            <button id="new-plan" class="button" type="button">New plan</button>
            <button id="import-plan" class="button is-quiet" type="button" title="Copy existing .md files into the library">Import</button>
            <button id="chain-plans" class="button is-quiet" type="button"
              title="Run several plans in a row, each starting when the one before it finishes">Chain</button>
            <button id="reveal-library" class="icon-action" type="button"
              title="Show library folder" aria-label="Show library folder">
              <i class="codicon codicon-library"></i>
            </button>
            <button id="reveal-results" class="icon-action" type="button"
              title="Show results folder" aria-label="Show results folder">
              <i class="codicon codicon-output"></i>
            </button>
            <button id="reveal-archive" class="icon-action" type="button"
              title="Show archive folder" aria-label="Show archive folder">
              <i class="codicon codicon-archive"></i>
            </button>
            <button id="open-settings" class="icon-action" type="button"
              title="Chronos settings" aria-label="Chronos settings">
              <i class="codicon codicon-gear"></i>
            </button>
          </div>
          <input id="search" class="search" type="search" placeholder="Search plans" aria-label="Search plans" />
        </header>
        <div id="plan-list" class="plan-list"></div>
      </aside>

      <div id="library-sash" class="sash sash-x" role="separator" aria-orientation="vertical"></div>

      <!-- tabindex="-1" so the F6 pane jump can land on the pane itself when it
           holds nothing focusable. -->
      <section id="detail" class="detail" tabindex="-1"></section>
    </main>

    <section id="activity" class="activity">
      <div id="activity-sash" class="sash sash-y" role="separator" aria-orientation="horizontal"></div>
      <header class="activity-head">
        <h2 class="activity-title">Runs</h2>
        <select id="activity-filter" class="activity-filter" data-focus-key="activity-filter" aria-label="Filter runs">
          <option value="all">All</option>
          <option value="upcoming">Upcoming</option>
          <option value="completed">Completed</option>
          <option value="attention">Needs attention</option>
        </select>
        <span id="cost" class="activity-cost"></span>
        <button id="activity-toggle" class="link-button" type="button" aria-expanded="true" aria-controls="activity-list">Hide</button>
      </header>
      <div id="activity-list" class="activity-list" tabindex="-1"></div>
    </section>

    <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
  </body>
</html>
